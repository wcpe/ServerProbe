group=top.wcpe.mc.plugin.serverprobe
version=0.8.0-SNAPSHOT
# taboolib-ioc 运行时版本。
# 1.2.0：修复跨平台注入崩溃（@PlatformSide 平台门控 + NoClassDefFoundError 防御性捕获）。
# 1.3.1：修复 ClassScanner 反射无容错导致整条注入链中断（单 jar 多平台引用它平台类时
#        NoClassDefFoundError 从 LOAD 冒泡 → 组件全未注册 → 插件 onEnable 自我禁用），
#        并把 @PlatformSide 判定前移到 scan 之前。本项已不再需要项目内自定义扫描器。
taboolib.ioc.version=1.3.1
# SQLite JDBC 驱动版本(ADR-0027:随发行 jar 内嵌闭包分发,由本变量集中管理,运行期不联网下载)
sqlite.jdbc.version=3.53.4.0
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true
# Gradle daemon 内存：多模块 Kotlin 编译 + detekt + 并发 daemon 需要足够 Metaspace
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# 说明：本文件在开发版（快照）流水线的 paths 清单里——版本号与构建参数变更会影响产物，
# 故改动本文件即触发一次开发版构建。
