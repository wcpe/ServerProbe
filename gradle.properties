group=top.wcpe.mc.plugin.serverprobe
version=0.7.1
# taboolib-ioc 运行时版本：1.2.0 修复跨平台注入崩溃(@PlatformSide 平台门控 + NoClassDefFoundError 防御性捕获;错误平台事件监听器曾致整插件 enable 崩溃)
taboolib.ioc.version=1.2.0
# SQLite JDBC 驱动版本(ADR-0027:随发行 jar 内嵌闭包分发,由本变量集中管理,运行期不联网下载)
sqlite.jdbc.version=3.53.4.0
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true
# Gradle daemon 内存：多模块 Kotlin 编译 + detekt + 并发 daemon 需要足够 Metaspace
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
