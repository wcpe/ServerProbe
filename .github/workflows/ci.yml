# 持续集成：分支与 PR 验证构建（构建 + 单测 + detekt 静态检查）。
# 纯文档改动（README/docs/wiki/.github/CHANGELOG 等）不触发构建。
#
# 正式发布由 release.yml 在 v* tag 时完成，副本不在这里构建，也不上传 Actions 产物
# （发布产物由 release.yml 发到 GitHub Release，不占 Actions artifact 配额）。
name: CI

on:
  # 手动触发用于：验证 CI 自身配置改动（push 的 paths-ignore 含 .github/**，
  # 改工作流文件时不会自动触发）；以及与基分支冲突、GitHub 不再为其创建 pull_request 运行时补跑。
  workflow_dispatch:
  push:
    branches: [ master, main ]
    # 正式发布 tag 由 release.yml 处理，CI 不重复构建
    tags-ignore:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/**'
      - '.claude/**'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/**'
      - '.claude/**'
      - '.editorconfig'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build:
    name: 构建 · 测试 · detekt
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Gradle 运行于 JDK 21(detekt 需 11+),编译 toolchain 用 JDK 8(核心 Java 8 字节码),
      # e2e 夹具与部分模块要 17。
      - name: 安装 JDK 8 / 17 / 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - name: 配置 Gradle(含缓存)
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 + 单元测试 + detekt 静态检查
        run: >-
          ./gradlew build --stacktrace
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64

  # Windows 交叉验证：项目日常在 Windows 开发，历史上出现过平台相关缺陷在 Windows 上被掩盖、
  # 只在 Linux 暴露的情况(如 HttpServer backlog=0 在 Linux 挂起而 Windows 掩盖、async-profiler
  # 平台差异)。此 job 在 Windows runner 上跑同一套构建，防止此类缺陷逃逸；
  # 与 Linux 构建逻辑保持一致，不额外发布产物。
  build-windows:
    name: 构建 · 测试 · detekt (Windows)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Gradle 运行于 JDK 21(detekt 需 11+),编译 toolchain 用 JDK 8(核心 Java 8 字节码),
      # e2e 夹具与部分模块要 17。
      - name: 安装 JDK 8 / 17 / 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - name: 配置 Gradle(含缓存)
        uses: gradle/actions/setup-gradle@v4

      # Windows runner 预装了独立 Gradle(chocolatey 的 gradle 9.x)，`./gradlew` 在默认 shell 下
      # 可能解析到 PATH 里的 gradle 命令而非仓库 wrapper，导致 -D 参数被当成任务名使构建失败
      # （实测报错：Task '.gradle.java.installations.fromEnv=...' not found）。
      # 故显式用 gradlew.bat 并指定 cmd shell，确保走仓库自带的 Gradle 版本。
      - name: 构建 + 单元测试 + detekt 静态检查
        shell: cmd
        run: gradlew.bat build --stacktrace -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64

  # 覆盖率统计：只产出报告、不设门槛(JaCoCo 已在 serverprobe.base 约定插件中统一应用)。
  # 目的：先积累几个月的真实基线数据，再据此讨论阈值；避免凭空定一个数把 PR 卡住或催生凑数测试。
  # 报告不挂进 build 链路，故单独跑并上传 artifact；本 job 失败不影响发版链路。
  coverage:
    name: 覆盖率统计(不设门槛)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 8 / 17 / 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - name: 配置 Gradle(含缓存)
        uses: gradle/actions/setup-gradle@v4

      # coverageSummary 已把各模块 JaCoCo 报告声明为任务输入并挂上 jacocoTestReport 依赖，
      # 故一条命令即可：先跑测试与报告，再打印行/分支覆盖率概览（不用于判定通过与否）。
      - name: 汇总覆盖率概览
        run: >-
          ./gradlew coverageSummary --stacktrace
          -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '*/build/reports/jacoco/'
          if-no-files-found: warn
          retention-days: 90
