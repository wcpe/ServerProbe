# 持续集成：分支与 PR 验证构建；推送 v* 标签时额外创建 GitHub Release。
# 纯文档改动（README/docs/wiki/.github/CHANGELOG 等）不触发构建；标签推送不受过滤、始终发版。
name: CI

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/**'
      - '.claude/**'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/**'
      - '.claude/**'
      - '.editorconfig'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build:
    name: 构建 · 测试 · detekt
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Gradle 运行于 JDK 21(detekt 需 11+),编译 toolchain 用 JDK 8(核心 Java 8 字节码)
      - name: 安装 JDK 8 与 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: 配置 Gradle(含缓存)
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 + 单元测试 + detekt 静态检查
        run: ./gradlew build --stacktrace -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64

      - name: 上传发行 jar
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: serverprobe-jar
          path: plugin/build/libs/ServerProbe-*.jar
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载发行 jar
        uses: actions/download-artifact@v4
        with:
          name: serverprobe-jar
          path: release

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/ServerProbe-*.jar --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" release/ServerProbe-*.jar --title "ServerProbe $TAG_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
