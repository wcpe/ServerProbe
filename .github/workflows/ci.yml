# 持续集成：分支与 PR 验证构建；推送 v* 标签时额外创建 GitHub Release。
# 纯文档改动（README/docs/wiki/.github/CHANGELOG 等）不触发构建；标签推送不受过滤、始终发版。
name: CI

on:
  # 手动触发用于验证 CI 自身配置改动：push 的 paths-ignore 含 .github/**，
  # 改工作流文件时不会自动触发，需在此手动跑一次确认。
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/**'
      - '.claude/**'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/**'
      - '.claude/**'
      - '.editorconfig'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build:
    name: 构建 · 测试 · detekt
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Gradle 运行于 JDK 21(detekt 需 11+),编译 toolchain 用 JDK 8(核心 Java 8 字节码)
      - name: 安装 JDK 8 与 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: 配置 Gradle(含缓存)
        uses: gradle/actions/setup-gradle@v4

      - name: 构建 + 单元测试 + detekt 静态检查
        run: ./gradlew build --stacktrace -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64

      - name: 上传发行 jar
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: serverprobe-jar
          path: plugin/build/libs/ServerProbe-*.jar
          if-no-files-found: error

  # Windows 交叉验证：项目日常在 Windows 开发，历史上出现过平台相关缺陷在 Windows 上被掩盖、
  # 只在 Linux 暴露的情况(如 HttpServer backlog=0 在 Linux 挂起而 Windows 掩盖、async-profiler
  # 平台差异)。此 job 在 Windows runner 上跑同一套构建，防止此类缺陷逃逸；
  # 与 Linux 构建逻辑保持一致，不额外发布产物。
  build-windows:
    name: 构建 · 测试 · detekt (Windows)
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Gradle 运行于 JDK 21(detekt 需 11+),编译 toolchain 用 JDK 8(核心 Java 8 字节码)
      - name: 安装 JDK 8 与 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: 配置 Gradle(含缓存)
        uses: gradle/actions/setup-gradle@v4

      # Windows runner 预装了独立 Gradle(chocolatey 的 gradle 9.x)，`./gradlew` 在默认 shell 下
      # 可能解析到 PATH 里的 gradle 命令而非仓库 wrapper，导致 -D 参数被当成任务名使构建失败
      # （实测报错：Task '.gradle.java.installations.fromEnv=...' not found）。
      # 故显式用 gradlew.bat 并指定 cmd shell，确保走仓库自带的 Gradle 版本。
      - name: 构建 + 单元测试 + detekt 静态检查
        shell: cmd
        run: gradlew.bat build --stacktrace -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64

  # 覆盖率统计：只产出报告、不设门槛(JaCoCo 已在 serverprobe.base 约定插件中统一应用)。
  # 目的：先积累几个月的真实基线数据，再据此讨论阈值；避免凭空定一个数把 PR 卡住或催生凑数测试。
  # 报告不挂进 build 链路，故单独跑并上传 artifact；本 job 失败不影响发版链路。
  coverage:
    name: 覆盖率统计(不设门槛)
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 8 与 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: 配置 Gradle(含缓存)
        uses: gradle/actions/setup-gradle@v4

      # 必须先跑测试产出 exec 数据，否则各模块的 jacocoTestReport 会因无数据被 SKIPPED
      - name: 生成各模块覆盖率报告
        run: ./gradlew test jacocoTestReport --stacktrace -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_21_X64

      - name: 汇总覆盖率概览
        run: |
          # 从各模块 XML 报告提取行/分支覆盖率，作为 PR 可读的基线数字（不用于判定通过与否）
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          line_c = line_m = br_c = br_m = 0
          for path in sorted(glob.glob('*/build/reports/jacoco/test/jacocoTestReport.xml') +
                             glob.glob('*/*/build/reports/jacoco/test/jacocoTestReport.xml')):
              root = ET.parse(path).getroot()
              for c in root.findall('counter'):
                  if c.get('type') == 'LINE':
                      line_m += int(c.get('missed')); line_c += int(c.get('covered'))
                  elif c.get('type') == 'BRANCH':
                      br_m += int(c.get('missed')); br_c += int(c.get('covered'))
          def pct(c, m):
              t = c + m
              return (c / t * 100) if t else 0.0
          print('行覆盖率: %.1f%% (%d/%d)' % (pct(line_c, line_m), line_c, line_c + line_m))
          print('分支覆盖率: %.1f%% (%d/%d)' % (pct(br_c, br_m), br_c, br_c + br_m))
          PY

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: '*/build/reports/jacoco/'
          if-no-files-found: warn
          retention-days: 90

  release:
    name: 发布 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载发行 jar
        uses: actions/download-artifact@v4
        with:
          name: serverprobe-jar
          path: release

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" release/ServerProbe-*.jar --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" release/ServerProbe-*.jar --title "ServerProbe $TAG_NAME" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
