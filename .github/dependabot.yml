# Dependabot：Gradle 依赖自动升级与漏洞告警。
# 每周扫描 dependencies 声明，按下方 ignore 规则排除需人工判断的坐标。
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    # 同时开放的 PR 上限：本项目依赖较多，限制 5 个避免刷屏
    open-pull-requests-limit: 5
    # 提交信息沿用 Conventional Commits，与仓库提交规范一致
    commit-message:
      prefix: "build"
      prefix-development: "chore"
      include: "scope"

    ignore:
      # NMS 版本锁定：ink.ptms.core 的坐标（如 v12004）跟随 Minecraft 版本矩阵，
      # 升级会破坏 NMS 反射适配，必须随 MC 版本支持计划人工调整。
      - dependency-name: "ink.ptms.core"

      # wcpe 私有 fork：io.izzel.taboolib 与 top.wcpe.taboolib.ioc 托管在
      # maven.wcpe.top 私有镜像，公共源（Maven Central）可能解析不到，
      # Dependabot 依据公共源提出的升级会导致构建失败。
      - dependency-name: "io.izzel.taboolib"
      - dependency-name: "top.wcpe.taboolib.ioc"

      # 服务端 API 受兼容矩阵约束：paper-api / bungeecord-api / velocity-api
      # 的升级需对照各服务端最低支持版本人工判断，
      # 盲目升级会抬高运行门槛、与 Java 8 字节码不变量冲突。
      - dependency-name: "io.papermc.paper:paper-api"
      - dependency-name: "net.md-5:bungeecord-api"
      - dependency-name: "com.velocitypowered:velocity-api"

      # JUnit 主版本升级：JUnit 6 要求 Java 17+，与本项目 Java 8 字节码目标
      # （ADR-3 锁定）硬冲突，解析期即失败。只忽略主版本，5.x 内的小版本仍会提示。
      - dependency-name: "org.junit.jupiter:junit-jupiter"
        update-types: ["version-update:semver-major"]

      # Gradle 主版本升级：不是版本号 bump，需专项迁移——Gradle 9 要求显式声明
      # JUnit Platform launcher（已就位），且当前构建仍在用对 9.0 已弃用的 API；
      # 还须验证 TabooLib 与 mc-testkit 插件在 Gradle 9 下的兼容性。
      # 迁移完成后移除本规则。
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]

      # Kotlin 插件主版本：架构规则锁定 Kotlin 2.1.0 / TabooLib 6.3.0（architecture-invariants
      # §4「技术栈锁定」，更换须走新 ADR）；且 CodeQL 当前不支持 2.4.20（实测报
      # KotlinVersionTooRecentError）。升级随 Kotlin 技术栈演进一并决策。
      - dependency-name: "org.jetbrains.kotlin.jvm:org.jetbrains.kotlin.jvm.gradle.plugin"
        update-types: ["version-update:semver-major"]

      # detekt 版本被静态检查规则固定（static-analysis §1：版本固定 1.23.7，存量问题由
      # 基线冻结、规则配置与其绑定）。升级须同步改规则并重建基线，属人工决策。
      - dependency-name: "io.gitlab.arturbosch.detekt:io.gitlab.arturbosch.detekt.gradle.plugin"
